<!DOCTYPE html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk | Singgah</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css"></head>
<body data-page="login"><div class="auth">
<aside class="side"><a href="index.html" class="logo"><b></b>Singgah</a><q>Selamat datang kembali. Liburanmu sudah menunggu.</q><small>© 2026 Singgah</small><span class="ring a"></span><span class="ring b"></span></aside>
<div class="formbox"><form data-form="login" novalidate>
<h1>Masuk</h1><p class="sub">Lanjutkan merencanakan liburan kamu.</p>
<div class="fld"><label for="email">Email</label><div class="inp"><input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email"></div><p class="err"></p></div>
<div class="fld"><label for="pw">Kata sandi</label><div class="inp"><input id="pw" name="pw" type="password" placeholder="Masukkan kata sandi" autocomplete="current-password"><button type="button" class="eye" aria-label="Tampilkan kata sandi"><i data-lucide="eye"></i></button></div><p class="err"></p></div>
<div class="row"><label class="chk"><input type="checkbox">Ingat saya</label><a href="#">Lupa kata sandi?</a></div>
<button class="btn p" type="submit"><span>Masuk</span><i data-lucide="arrow-right"></i></button>
<p class="alt">Belum punya akun? <a href="register.html">Daftar</a></p>
</form></div></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script><script src="script.js"></script>
</body></html>
