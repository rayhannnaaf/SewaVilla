<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Daftar | Singgah</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    </head>
<body data-page="register"><div class="auth">
<aside class="side"><a href="index.html" class="logo"><b></b>Singgah</a><q>Satu akun untuk semua tempat menginap.</q>
    <small>© 2026 Singgah</small>
    <span class="ring a"></span>
    <span class="ring b"></span></aside>
<div class="formbox"><form data-form="register" novalidate>
<h1>Buat akun</h1><p class="sub">Gratis, tanpa biaya langganan.</p>
<div class="fld"><label for="nama">Nama lengkap</label>
    <div class="inp"><input id="nama" name="nama" type="text" placeholder="Nama kamu" autocomplete="name"></div>
    <p class="err"></p></div>
<div class="fld">
    <label for="email">Email</label><div class="inp"><input id="email" name="email" type="email" placeholder="nama@email.com" autocomplete="email"></div>
    <p class="err"></p></div>
<div class="fld"><label for="pw">Kata sandi</label>
    <div class="inp"><input id="pw" name="pw" type="password" placeholder="Minimal 8 karakter" autocomplete="new-password"><button type="button" class="eye" aria-label="Tampilkan kata sandi"><i data-lucide="eye"></i></button></div><p class="err"></p></div>
<div class="fld"><label for="pw2">Ulangi kata sandi</label><div class="inp"><input id="pw2" name="pw2" type="password" placeholder="Ketik ulang kata sandi" autocomplete="new-password"><button type="button" class="eye" aria-label="Tampilkan kata sandi"><i data-lucide="eye"></i></button></div><p class="err"></p></div>
<div class="fld"><label class="chk"><input type="checkbox" required>Aku setuju dengan syarat penggunaan</label><p class="err"></p></div>
<button class="btn p" type="submit"><span>Daftar</span>
    <i data-lucide="arrow-right"></i></button>
<p class="alt">Sudah punya akun? <a href="login.html">Masuk</a></p>
</form></div></div>
<script src="https://cdn.jsdelivr.net/npm/lucide@0.263.1/dist/umd/lucide.min.js"></script>
<script src="script.js"></script>
</body>
</html>
